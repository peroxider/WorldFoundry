[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "worldforge"
version = "0.1.0"
description = "Ascend NPU world model training + inference platform (Phase-1: V-JEPA 2)"
requires-python = "==3.11.*"
dependencies = [
    "torch==2.9.0",
    "torch_npu==2.9.0",
    "transformers==4.55.0",
    "peft==0.18.0",
    "accelerate==1.10.0",
    "datasets==3.6.0",
    "pyyaml>=6.0",
    "numpy<2.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "prometheus-client>=0.21",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
]

[project.optional-dependencies]
train = ["deepspeed>=0.15"]
inf = ["vllm==0.18.0", "vllm-ascend==0.18.0"]
rl = ["verl==0.5.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]
quant = ["msmodelslim==26.1.0"]
video = ["av==14.0.0", "decord==0.6.0"]

[tool.setuptools.packages.find]
include = ["worldforge_*"]

[tool.pytest.ini_options]
testpaths = ["worldforge_train/tests", "worldforge_inf/tests", "worldforge_rl/tests"]
addopts = "-v --tb=short"