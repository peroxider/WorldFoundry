[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "worldfoundry"
version = "0.1.0"
description = "Ascend NPU world-model rendering/training/inference framework (JEPA family, simulator RL, simulator + hardware deployment) — orchestrating vllm-ascend, mindspeed, verl/RLinf, msmodelslim"
requires-python = "==3.11.*"
dependencies = [
    "torch==2.9.0",
    "torch_npu==2.9.0",
    "transformers==4.55.0",
    "peft==0.18.0",
    "accelerate==1.10.0",
    "datasets==3.6.0",
    "pyyaml>=6.0",
    "numpy<2.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "prometheus-client>=0.21",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
]

[project.optional-dependencies]
train = ["deepspeed>=0.15"]
inf = ["vllm==0.18.0", "vllm-ascend==0.18.0"]
rl = ["verl==0.5.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]
quant = ["msmodelslim==26.1.0"]
video = ["av==14.0.0", "decord==0.6.0"]

[project.entry-points."vllm.platform_plugins"]
worldfoundry_inf = "worldfoundry_inf._vllm_ascend_plugin:register"

[project.entry-points."vllm.general_plugins"]
vjepa2_model = "worldfoundry_inf._vllm_ascend_plugin:register_model"

[tool.setuptools.packages.find]
include = ["worldfoundry_*"]

[tool.pytest.ini_options]
testpaths = ["worldfoundry_train/tests", "worldfoundry_inf/tests", "worldfoundry_rl/tests"]
addopts = "-v --tb=short"