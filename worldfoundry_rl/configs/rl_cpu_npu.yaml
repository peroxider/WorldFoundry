# Example: switch CPU <-> NPU and other axes purely from the `backends:` map.
#
# Drives `python -m worldfoundry_rl.train --config worldfoundry_rl/configs/rl_cpu_npu.yaml`.
# The `backends:` block is read by the CLI and resolved through the unified
# `worldfoundry_common.backends.resolve_config` entry (see backends/__init__.py).
# Any axis omitted here falls back to a sensible default, so you only need to
# spell out the axes you want to switch.
#
# Quick switches:
#   device  cpu   -> always CPU        (WORLDFORGE_DEVICE still honored by `auto`)
#   device  npu   -> requires the Ascend base image (torch_npu 2.9.0 + CANN)
#   device  auto  -> npu if available, else cpu
#   sim_env mock  -> in-process synthetic env (no dm_control needed)
#   sim_env mujoco-> MuJoCo FrankaKitchenEnv (requires dm_control+mujoco)
#   training self -> native PPO; verl / rlinf -> runner adapters (need install)
#   inference torch-> in-process PyTorch worker; vllm / sglang (need install)
#   model    tiny -> self-developed JEPA; transformers -> HF VJEPA2 shim

backends:
  device: auto        # cpu | npu | auto
  sim_env: mock       # mock | mujoco | franka_kitchen | droid | manipulator
  training: self      # self | pytorch | fsdp | mindspeed | verl | rlinf
  inference: torch    # torch | vllm | sglang
  model: self         # self | tiny | transformers | hf_vjepa2

env:
  # `env.type` may be a full "pkg:Cls" spec or a `backends.sim_env` alias.
  # When `env.type` is absent, the CLI falls back to `backends.sim_env` above.
  num_envs: 4

policy:
  hidden_dim: 64
  encoder: state_mlp

ppo:                       # fields map directly to PPOConfig.__init__
  rollout_steps: 32
  epochs_per_update: 4
  minibatch_size: 64
  gamma: 0.99
  gae_lambda: 0.95
  clip_ratio: 0.2
  value_loss_coef: 0.5
  entropy_coef: 0.01
  max_grad_norm: 0.5
  learning_rate: 3.0e-4
  normalize_advantages: true

training:
  parallel: ddp              # v1 single-process; 'rl' is an accepted alias
  total_pool_steps: 192
  save_every_n: 0
  log_every_n: 1

data:
  manifest: null
  mask_tubelet_size: [2, 14, 14]
  mask_ratio: 0.75

seed: 42
