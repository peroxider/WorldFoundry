model:
  hf_repo: facebook/vjepa2-vitl-1.2b
  bf16: true
  gradient_checkpointing: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  bias: none

training:
  parallel: ddp          # ddp | fsdp
  per_device_batch: 2
  grad_accum: 8
  epochs: 1
  lr: 1.0e-4
  warmup_steps: 100
  log_every_n: 10
  save_every_n: 500

data:
  manifest: /data/videomix22m/manifest.csv
  mask_tubelet_size: [2, 14, 14]
  mask_ratio: 0.75

# Optional: quantize the baseline weights before training (W18+).
# Requires `worldforge_inf` and a saved local model dir in `source_dir`.
# Leave this block commented out to train on the bf16 baseline directly.
#
# quant:
#   type: fake             # or "w8a8" (Atlas-only, requires msmodelslim==26.1.0)
#   source_dir: /data/vjepa2-vitl-1.2b          # local saved-HF dir (NOT a HF Hub ID)
#   output_dir: /data/vjepa2-vitl-1.2b-fake     # quantize_model writes here
#   calibration_dataset: videomix22m-512          # optional
