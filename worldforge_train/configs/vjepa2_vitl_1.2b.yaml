model:
  hf_repo: facebook/vjepa2-vitl-1.2b
  bf16: true
  gradient_checkpointing: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  bias: none

training:
  parallel: ddp          # ddp | fsdp
  per_device_batch: 2
  grad_accum: 8
  epochs: 1
  lr: 1.0e-4
  warmup_steps: 100
  log_every_n: 10
  save_every_n: 500

data:
  manifest: /data/videomix22m/manifest.csv
  mask_tubelet_size: [2, 14, 14]
  mask_ratio: 0.75
