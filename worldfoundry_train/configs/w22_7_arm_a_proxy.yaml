# W22.7 A/B experiment — ARM A (baseline): legacy proxy loss.
#
# Identical to w22_7_arm_b_jepa.yaml in every field EXCEPT jepa.enabled
# (design §9.2: fixed data subset, same seed/steps/batch/grad_accum/lr so
# both arms see the same sample sequence and the same optimizer-step count).
#
# Data subset: scripts/archive/w22_7/w22_7_make_subset.py generates a FIXED manifest subset
# (seeded sampling, written to disk once); both arms MUST point
# data.manifest at the same generated file. The dataset consumes the
# manifest sequentially (no shuffle) and mask_fn is seeded per-sample-index
# (dataset.py:76), so sample + mask sequences are bit-identical across arms.
#
# Atlas run parameters (hardware window): 8x NPU, FSDP FULL_SHARD, hccl
# backend, bf16 — driven by scripts/w22_7_ab_experiment.sh via torchrun.
# NOTE: NPU device migration of the trainer loop is a separate work item
# (W20); until it lands, the Atlas path runs the same code through
# torchrun + setup_fsdp with tensors on NPU. cpu_offload must stay false
# (mutually exclusive with jepa.enabled on arm B, design §8.3).

model:
  hf_repo: facebook/vjepa2-vitl-1.2b
  bf16: true
  gradient_checkpointing: true

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  bias: none

training:
  parallel: fsdp           # Atlas: FSDPStrategy FULL_SHARD over 8 hccl ranks
  per_device_batch: 2
  grad_accum: 8
  epochs: 1
  lr: 1.0e-4
  warmup_steps: 100
  log_every_n: 10
  save_every_n: 250        # probing metrics are computed per checkpoint step

data:
  manifest: bench_results/w22_7/subset_manifest.csv   # GENERATED, fixed subset
  mask_tubelet_size: [2, 14, 14]
  mask_ratio: 0.75

jepa:
  enabled: false           # ARM A: proxy-loss baseline (default_loss_fn)
